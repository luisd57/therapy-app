name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: therapy_db
          POSTGRES_USER: therapy_user
          POSTGRES_PASSWORD: therapy_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U therapy_user -d therapy_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      APP_SECRET: test_secret_for_testing_only
      DATABASE_URL: "postgresql://therapy_user:therapy_pass@localhost:5432/therapy_db?serverVersion=16&charset=utf8"
      REDIS_URL: "redis://localhost:6379"
      MAILER_DSN: "null://null"
      JWT_SECRET_KEY: "%kernel.project_dir%/config/jwt/private.pem"
      JWT_PUBLIC_KEY: "%kernel.project_dir%/config/jwt/public.pem"
      JWT_PASSPHRASE: therapy_jwt_passphrase
      JWT_TOKEN_TTL: 28800
      APP_FRONTEND_URL: http://localhost:3000
      INVITATION_TOKEN_TTL: 86400
      PASSWORD_RESET_TOKEN_TTL: 3600
      DEFAULT_URI: http://localhost
      TRUSTED_PROXIES: 127.0.0.1
      JWT_COOKIE_SECURE: 'false'
      APPOINTMENT_DURATION_MINUTES: 50
      SLOT_LOCK_TTL: 600
      CORS_ALLOW_ORIGIN: '^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, pdo_pgsql, intl
          tools: composer:v2
          coverage: none

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            API/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('API/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Create empty .env (required by Symfony Dotenv::bootEnv)
        working-directory: API
        run: touch .env

      - name: Install API dependencies
        working-directory: API
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate JWT keypair
        working-directory: API
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists --no-interaction

      - name: Create test database
        working-directory: API
        run: php bin/console doctrine:database:create --env=test --if-not-exists --no-interaction

      - name: Run migrations on test database
        working-directory: API
        run: php bin/console doctrine:migrations:migrate --env=test --no-interaction --all-or-nothing

      - name: Run PHPUnit
        working-directory: API
        run: vendor/bin/phpunit

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            landing/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Lint dashboard
        working-directory: dashboard
        run: npm run lint

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

      - name: Install landing dependencies
        working-directory: landing
        run: npm ci

      - name: Build landing
        working-directory: landing
        run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest

    env:
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.ci.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start core services
        run: $COMPOSE up -d postgres redis nginx php mailhog dashboard

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if $COMPOSE exec -T postgres pg_isready -U therapy_user -d therapy_db; then
              exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready" >&2
          exit 1

      - name: Wait for Redis
        run: |
          for i in $(seq 1 30); do
            if $COMPOSE exec -T redis redis-cli -a therapy_redis_pass ping | grep -q PONG; then
              exit 0
            fi
            sleep 2
          done
          echo "Redis did not become ready" >&2
          exit 1

      - name: Fix volume ownership
        # Fresh named volumes (php_vendor, php_var) mount empty and root-owned, but
        # the php container runs as the symfony user — chown so composer/console can write.
        run: $COMPOSE exec -T --user root php chown -R symfony:symfony /var/www/html/vendor /var/www/html/var

      - name: Install API dependencies
        run: $COMPOSE exec -T php composer install --no-interaction --prefer-dist --no-progress

      - name: Generate JWT keypair
        run: $COMPOSE exec -T php php bin/console lexik:jwt:generate-keypair --skip-if-exists --no-interaction

      - name: Create database
        run: $COMPOSE exec -T php php bin/console doctrine:database:create --if-not-exists --no-interaction

      - name: Run migrations
        run: $COMPOSE exec -T php php bin/console doctrine:migrations:migrate --no-interaction --all-or-nothing

      - name: Seed therapist + schedule
        run: |
          $COMPOSE exec -T php php bin/console app:create-therapist therapist@example.com "Therapist" 'VerifyPass1!'
          $COMPOSE exec -T php php bin/console app:seed-schedule

      - name: Run dashboard e2e
        run: $COMPOSE --profile e2e run --rm playwright

      - name: Run landing e2e
        run: $COMPOSE --profile e2e run --rm playwright-landing

      - name: Upload dashboard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-playwright-report
          path: |
            dashboard/playwright-report
            dashboard/test-results
          if-no-files-found: ignore

      - name: Upload landing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landing-playwright-report
          path: |
            landing/playwright-report
            landing/test-results
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: $COMPOSE down -v
