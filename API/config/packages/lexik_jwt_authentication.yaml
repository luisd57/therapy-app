# config/packages/lexik_jwt_authentication.yaml
lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'
    token_ttl: '%env(int:JWT_TOKEN_TTL)%'

    # Optional customizations
    user_id_claim: email

    token_extractors:
        # Built-in cookie extractor disabled: only supports one cookie name.
        # We use a custom extractor that tries both role-scoped cookies
        # (THERAPY_THERAPIST_JWT and THERAPY_PATIENT_JWT) so a patient login
        # in the same browser cannot overwrite a therapist's session.
        cookie:
            enabled: false
        authorization_header:
            enabled: true
            prefix: Bearer
            name: Authorization
