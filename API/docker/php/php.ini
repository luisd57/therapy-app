[PHP]
memory_limit = 512M
max_execution_time = 60
upload_max_filesize = 2M
post_max_size = 2M
; UTC is the canonical zone for every stored instant. The practice's wall-clock
; zone is PRACTICE_TIMEZONE, resolved through PracticeTimezoneProviderInterface —
; never through PHP's default. Changing this back would silently reinterpret
; every naive DateTime the code still constructs.
date.timezone = UTC
expose_php = Off
display_errors = Off

[opcache]
opcache.enable = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

[Session]
session.auto_start = Off
