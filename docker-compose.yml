version: '3.8'

services:
  php:
    build:
      context: ./API
      dockerfile: docker/php/Dockerfile
    container_name: therapy_php
    volumes:
      - ./API:/var/www/html
      - ./API/docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
      - php_vendor:/var/www/html/vendor
      - php_var:/var/www/html/var
    depends_on:
      - postgres
      - redis
    networks:
      - therapy_network
    environment:
      - APP_ENV=dev
      - DATABASE_URL=postgresql://therapy_user:therapy_pass@postgres:5432/therapy_db?serverVersion=16&charset=utf8
      # Container OS and Postgres session both UTC, matching php.ini. The practice's
      # wall-clock zone is PRACTICE_TIMEZONE, never the process default.
      - TZ=UTC
      - PGTZ=UTC

  nginx:
    image: nginx:alpine
    container_name: therapy_nginx
    ports:
      - "8080:80"
    volumes:
      - ./API:/var/www/html
      - ./API/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - therapy_network

  postgres:
    image: postgres:16-alpine
    container_name: therapy_postgres
    environment:
      POSTGRES_DB: therapy_db
      POSTGRES_USER: therapy_user
      POSTGRES_PASSWORD: therapy_pass
      # Explicit so it survives an image bump; timestamptz math must not depend
      # on a server-local zone.
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - therapy_network

  mailhog:
    image: mailhog/mailhog
    container_name: therapy_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - therapy_network

  redis:
    image: redis:7-alpine
    container_name: therapy_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-therapy_redis_pass}
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - therapy_network

  cron:
    build:
      context: ./API
      dockerfile: docker/cron/Dockerfile
    container_name: therapy_cron
    volumes:
      - ./API:/var/www/html
      - ./API/docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
      - php_vendor:/var/www/html/vendor
      - php_var:/var/www/html/var
    depends_on:
      - postgres
      - redis
    networks:
      - therapy_network
    environment:
      - APP_ENV=dev
      - DATABASE_URL=postgresql://therapy_user:therapy_pass@postgres:5432/therapy_db?serverVersion=16&charset=utf8
      # cron reads the container OS zone, so this is what puts the crontab on the
      # therapist's clock. PHP is unaffected: php.ini pins date.timezone to UTC.
      - TZ=America/Caracas
      - PGTZ=UTC

  landing:
    image: node:22-alpine
    container_name: therapy_landing
    working_dir: /app
    volumes:
      - ./landing:/app
      - landing_node_modules:/app/node_modules
    ports:
      - "4321:4321"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - therapy_network

  dashboard:
    image: node:22-alpine
    container_name: therapy_dashboard
    working_dir: /app
    volumes:
      - ./dashboard:/app
      - dashboard_node_modules:/app/node_modules
    ports:
      - "4200:4200"
    command: sh -c "npm install && npx ng serve --host 0.0.0.0 --poll 2000"
    networks:
      - therapy_network

  playwright:
    # Pinned to the same minor as dashboard/package.json @playwright/test.
    # Browsers come preinstalled in the image - no separate `playwright install` needed.
    # One-shot runner; not started by `docker-compose up`. Invoke via:
    #   docker-compose --profile e2e run --rm playwright
    image: mcr.microsoft.com/playwright:v1.49.1-noble
    container_name: therapy_playwright
    working_dir: /app
    volumes:
      - ./dashboard:/app
      - playwright_node_modules:/app/node_modules
    networks:
      - therapy_network
    environment:
      DASHBOARD_URL: ${DASHBOARD_URL:-http://dashboard:4200}
      MAILHOG_URL: ${MAILHOG_URL:-http://mailhog:8025}
      THERAPIST_EMAIL: ${THERAPIST_EMAIL:-therapist@example.com}
      THERAPIST_PASSWORD: ${THERAPIST_PASSWORD:-VerifyPass1!}
      CI: "1"
    command: sh -c "npm install --omit=optional --no-audit --no-fund && npx playwright test"
    depends_on:
      - dashboard
      - nginx
      - mailhog
    profiles:
      - e2e

  playwright-report:
    # Serves dashboard/playwright-report/ over HTTP so the trace viewer works
    # (file:// breaks the trace viewer's Service Worker).
    # Invoke with: docker-compose --profile e2e up playwright-report
    # Then open http://localhost:9323 in your browser. Ctrl-C to stop.
    image: mcr.microsoft.com/playwright:v1.49.1-noble
    container_name: therapy_playwright_report
    working_dir: /app
    volumes:
      - ./dashboard:/app
      - playwright_node_modules:/app/node_modules
    ports:
      - "9323:9323"
    command: sh -c "test -d node_modules || npm install --omit=optional --no-audit --no-fund; npx playwright show-report --host 0.0.0.0"
    profiles:
      - e2e

  playwright-landing:
    # E2E runner for the public landing page. Self-contained: starts its OWN Astro
    # dev server (via Playwright's webServer) bound to 127.0.0.1 so the page origin
    # satisfies the API's loopback CORS rule. PUBLIC_API_BASE_URL is overridden to
    # reach nginx on the compose network (the landing/.env default localhost:8080
    # is unreachable from inside this container). Prereq: `app:seed-schedule` seeded.
    # Invoke via: docker-compose --profile e2e run --rm playwright-landing
    image: mcr.microsoft.com/playwright:v1.49.1-noble
    container_name: therapy_playwright_landing
    working_dir: /app
    volumes:
      - ./landing:/app
      - landing_playwright_node_modules:/app/node_modules
    networks:
      - therapy_network
    environment:
      LANDING_URL: ${LANDING_URL:-http://127.0.0.1:4321}
      API_BASE_URL: ${LANDING_API_BASE_URL:-http://nginx/api}
      PUBLIC_API_BASE_URL: ${LANDING_API_BASE_URL:-http://nginx/api}
      # One spec swaps the schedule for an in-person-only block and puts it back.
      THERAPIST_EMAIL: ${THERAPIST_EMAIL:-therapist@example.com}
      THERAPIST_PASSWORD: ${THERAPIST_PASSWORD:-VerifyPass1!}
      CI: "1"
    command: sh -c "npm install --no-audit --no-fund && npx playwright test"
    depends_on:
      - nginx
    profiles:
      - e2e

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: therapy_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGPASSFILE: /tmp/pgpassfile
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./API/docker/pgadmin/servers.json:/pgadmin4/servers.json
      - ./API/docker/pgadmin/pgpassfile:/tmp/pgpassfile
    depends_on:
      - postgres
    networks:
      - therapy_network

networks:
  therapy_network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  landing_node_modules:
  dashboard_node_modules:
  playwright_node_modules:
  landing_playwright_node_modules:
  php_vendor:
  php_var:
