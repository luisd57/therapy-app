version: '3.8'

services:
  php:
    build:
      context: ./API
      dockerfile: docker/php/Dockerfile
    container_name: therapy_php
    volumes:
      - ./API:/var/www/html
      - ./API/docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
      - php_vendor:/var/www/html/vendor
      - php_var:/var/www/html/var
    depends_on:
      - postgres
      - redis
    networks:
      - therapy_network
    environment:
      - APP_ENV=dev
      - DATABASE_URL=postgresql://therapy_user:therapy_pass@postgres:5432/therapy_db?serverVersion=16&charset=utf8

  nginx:
    image: nginx:alpine
    container_name: therapy_nginx
    ports:
      - "8080:80"
    volumes:
      - ./API:/var/www/html
      - ./API/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - therapy_network

  postgres:
    image: postgres:16-alpine
    container_name: therapy_postgres
    environment:
      POSTGRES_DB: therapy_db
      POSTGRES_USER: therapy_user
      POSTGRES_PASSWORD: therapy_pass
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - therapy_network

  mailhog:
    image: mailhog/mailhog
    container_name: therapy_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - therapy_network

  redis:
    image: redis:7-alpine
    container_name: therapy_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-therapy_redis_pass}
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - therapy_network

  cron:
    build:
      context: ./API
      dockerfile: docker/cron/Dockerfile
    container_name: therapy_cron
    volumes:
      - ./API:/var/www/html
      - ./API/docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
      - php_vendor:/var/www/html/vendor
      - php_var:/var/www/html/var
    depends_on:
      - postgres
      - redis
    networks:
      - therapy_network
    environment:
      - APP_ENV=dev
      - DATABASE_URL=postgresql://therapy_user:therapy_pass@postgres:5432/therapy_db?serverVersion=16&charset=utf8

  landing:
    image: node:22-alpine
    container_name: therapy_landing
    working_dir: /app
    volumes:
      - ./landing:/app
      - landing_node_modules:/app/node_modules
    ports:
      - "4321:4321"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - therapy_network

  dashboard:
    image: node:22-alpine
    container_name: therapy_dashboard
    working_dir: /app
    volumes:
      - ./dashboard:/app
      - dashboard_node_modules:/app/node_modules
    ports:
      - "4200:4200"
    command: sh -c "npm install && npx ng serve --host 0.0.0.0 --poll 2000"
    networks:
      - therapy_network

  playwright:
    # Pinned to the same minor as dashboard/package.json @playwright/test.
    # Browsers come preinstalled in the image — no separate `playwright install` needed.
    # One-shot runner; not started by `docker-compose up`. Invoke via:
    #   docker-compose --profile e2e run --rm playwright
    image: mcr.microsoft.com/playwright:v1.49.1-noble
    container_name: therapy_playwright
    working_dir: /app
    volumes:
      - ./dashboard:/app
      - playwright_node_modules:/app/node_modules
    networks:
      - therapy_network
    environment:
      DASHBOARD_URL: ${DASHBOARD_URL:-http://dashboard:4200}
      MAILHOG_URL: ${MAILHOG_URL:-http://mailhog:8025}
      THERAPIST_EMAIL: ${THERAPIST_EMAIL:-therapist@example.com}
      THERAPIST_PASSWORD: ${THERAPIST_PASSWORD:-VerifyPass1!}
      CI: "1"
    command: sh -c "npm install --omit=optional --no-audit --no-fund && npx playwright test"
    depends_on:
      - dashboard
      - nginx
      - mailhog
    profiles:
      - e2e

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: therapy_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGPASSFILE: /tmp/pgpassfile
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./API/docker/pgadmin/servers.json:/pgadmin4/servers.json
      - ./API/docker/pgadmin/pgpassfile:/tmp/pgpassfile
    depends_on:
      - postgres
    networks:
      - therapy_network

networks:
  therapy_network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  landing_node_modules:
  dashboard_node_modules:
  playwright_node_modules:
  php_vendor:
  php_var:
